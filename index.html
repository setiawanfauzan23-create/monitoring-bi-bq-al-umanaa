<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Absensi Santri - Al Umanaa</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f4f6f9; color: #333; }
        .header { background-color: #2c3e50; color: white; padding: 20px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        .form-container, .table-container { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 30px; }
        h2 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #3498db; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { background-color: #2980b9; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #ecf0f1; }
        th { background-color: #f8f9fa; color: #34495e; font-weight: 600; }
        .badge { padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .badge.hadir { background-color: #d4edda; color: #155724; }
        .badge.izin { background-color: #fff3cd; color: #856404; }
        .badge.sakit { background-color: #e8f4fd; color: #1c3d5a; }
        .badge.alfa { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div class="header">
    <h1>Sistem Monitoring Absensi Santri</h1>
    <p>Pondok Pesantren Al Umanaa</p>
</div>

<div class="container">
    <!-- Form Input Absensi -->
    <div class="form-container">
        <h2>Input Kehadiran Santri</h2>
        <form id="absensiForm">
            <div class="form-group">
                <label for="namaSantri">Nama Lengkap Santri</label>
                <input type="text" id="namaSantri" placeholder="Masukkan nama santri..." required>
            </div>
            <div class="form-group">
                <label for="kelasKamar">Kelas / Kamar</label>
                <input type="text" id="kelasKamar" placeholder="Contoh: Kelas X - Kamar A" required>
            </div>
            <div class="form-group">
                <label for="statusKehadiran">Status</label>
                <select id="statusKehadiran">
                    <option value="Hadir">Hadir</option>
                    <option value="Izin">Izin</option>
                    <option value="Sakit">Sakit</option>
                    <option value="Alfa">Alfa</option>
                </select>
            </div>
            <button type="submit">Simpan Kehadiran</button>
        </form>
    </div>

    <!-- Tabel Data Monitoring -->
    <div class="table-container">
        <h2>Daftar Kehadiran Hari Ini</h2>
        <table>
            <thead>
                <tr>
                    <th>Nama Santri</th>
                    <th>Kelas / Kamar</th>
                    <th>Waktu Input</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="tabelBody">
                <!-- Data akan muncul otomatis di sini -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const form = document.getElementById('absensiForm');
    const tabelBody = document.getElementById('tabelBody');

    function muatData() {
        const dataSantri = JSON.parse(localStorage.getItem('dataAbsensi')) || [];
        tabelBody.innerHTML = '';
        dataSantri.forEach(santri => {
            tambahBarisTabel(santri);
        });
    }

    function tambahBarisTabel(santri) {
        const row = document.createElement('tr');
        row.innerHTML = `
            <td>${santri.nama}</td>
            <td>${santri.kelas}</td>
            <td>${santri.waktu}</td>
            <td><span class="badge ${santri.status.toLowerCase()}">${santri.status}</span></td>
        `;
        tabelBody.appendChild(row);
    }

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const nama = document.getElementById('namaSantri').value;
        const kelas = document.getElementById('kelasKamar').value;
        const status = document.getElementById('statusKehadiran').value;
        
        const sekarang = new Date();
        const waktu = sekarang.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) + ' WIB';

        const santriBaru = { nama, kelas, status, waktu };

        const dataSantri = JSON.parse(localStorage.getItem('dataAbsensi')) || [];
        dataSantri.push(santriBaru);
        localStorage.setItem('dataAbsensi', JSON.stringify(dataSantri));

        tambahBarisTabel(santriBaru);
        form.reset();
    });

    muatData();
</script>

</body>
</html>
