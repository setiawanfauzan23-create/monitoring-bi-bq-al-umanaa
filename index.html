<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BI/BQ AI Studio - Al Umanaa Monitoring System</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-purple: #c084fc;
            --success: #2cc71;
            --warning: #fbbf24;
            --danger: #f87171;
        }

        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: var(--bg-primary); 
            color: var(--text-main); 
        }

        .header { 
            background-color: var(--bg-secondary); 
            color: white; 
            padding: 20px; 
            text-align: center; 
            border-bottom: 1px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); 
        }
        
        .header h1 { margin: 0; font-size: 24px; color: var(--accent-blue); font-weight: 700; letter-spacing: 0.5px; }
        .header p { margin: 5px 0 0 0; color: var(--text-muted); font-size: 14px; }

        .container { max-width: 1250px; margin: 30px auto; padding: 0 20px; }
        
        /* Dasbor Statistik Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { 
            background: var(--bg-secondary); 
            padding: 20px; 
            border-radius: 12px; 
            border: 1px solid #334155; 
            text-align: center; 
            position: relative;
            overflow: hidden;
        }
        .stat-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: var(--accent-blue);
        }
        .stat-card.hadir::before { background: #10b981; }
        .stat-card.izin::before { background: #f59e0b; }
        .stat-card.alfa::before { background: #ef4444; }
        
        .stat-card h3 { margin: 0 0 8px 0; color: var(--text-muted); font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-card .value { font-size: 32px; font-weight: bold; color: var(--text-main); }

        .main-layout { display: flex; gap: 30px; flex-wrap: wrap; }
        .sidebar { flex: 1; min-width: 320px; }
        .content-area { flex: 2; min-width: 650px; }
        
        .card-box { 
            background: var(--bg-secondary); 
            padding: 25px; 
            border-radius: 12px; 
            border: 1px solid #334155; 
            margin-bottom: 30px; 
        }
        
        h2 { margin-top: 0; color: var(--accent-blue); border-bottom: 1px solid #334155; padding-bottom: 12px; font-size: 18px; font-weight: 600; }
        
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 13px; color: var(--text-muted); }
        .form-group input, .form-group select { 
            width: 100%; padding: 11px; 
            background-color: var(--bg-primary); 
            border: 1px solid #475569; border-radius: 6px; 
            color: var(--text-main); box-sizing: border-box; 
            font-size: 14px;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none; border-color: var(--accent-blue);
        }
        
        button.btn-submit { 
            background-color: #0284c7; color: white; padding: 12px; 
            border: none; border-radius: 6px; cursor: pointer; 
            font-weight: bold; width: 100%; font-size: 15px; 
            transition: background 0.2s;
        }
        button.btn-submit:hover { background-color: #0369a1; }
        
        /* Tabel & Kontrol */
        .table-header-actions { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 12px; margin-bottom: 15px; }
        .table-header-actions h2 { margin: 0; border: none; padding: 0; }
        .controls { display: flex; gap: 12px; align-items: center; }
        .controls select { padding: 8px 12px; background: var(--bg-primary); border: 1px solid #475569; border-radius: 6px; color: var(--text-main); font-size: 13px; }
        
        .btn-action { padding: 8px 14px; background: #334155; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; }
        .btn-action:hover { background: #475569; }

        table { width: 100%; border-collapse: collapse; background: transparent; }
        th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid #334155; font-size: 14px; }
        th { background-color: rgba(15, 23, 42, 0.4); color: var(--accent-blue); font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
        tr:hover { background-color: rgba(51, 65, 85, 0.2); }
        
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
        .badge.hadir { background-color: rgba(16, 185, 129, 0.2); color: #34d399; }
        .badge.izin { background-color: rgba(245, 158, 11, 0.2); color: #fbbf24; }
        .badge.sakit { background-color: rgba(56, 189, 248, 0.2); color: #7dd3fc; }
        .badge.alfa { background-color: rgba(239, 68, 68, 0.2); color: #f87171; }
        
        .badge-prog { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; color: #0f172a; }
        .badge-prog.bi { background-color: var(--accent-blue); }
        .badge-prog.bq { background-color: var(--accent-purple); }

        .btn-delete { background-color: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2); padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .btn-delete:hover { background-color: rgba(239, 68, 68, 0.3); }
    </style>
</head>
<body>

<div class="header">
    <h1>BI/BQ AI STUDIO - AL UMANAA</h1>
    <p>Sistem Pemantauan Pusat Real-Time Data Kluster Santri</p>
</div>

<div class="container">
    <!-- WIDGET PANEL DASBOR STATISTIK -->
    <div class="stats-grid">
        <div class="stat-card">
            <h3>Total Kluster Log</h3>
            <div class="value" id="statTotal">0</div>
        </div>
        <div class="stat-card hadir">
            <h3>Hadir</h3>
            <div class="value" id="statHadir">0</div>
        </div>
        <div class="stat-card izin">
            <h3>Izin / Sakit</h3>
            <div class="value" id="statIzin">0</div>
        </div>
        <div class="stat-card alfa">
            <h3>Tanpa Keterangan</h3>
            <div class="value" id="statAlfa">0</div>
        </div>
    </div>

    <div class="main-layout">
        <!-- FORM PANEL KIRI -->
        <div class="sidebar">
            <div class="card-box">
                <h2>Input Presensi Studio</h2>
                <form id="absensiForm">
                    <div class="form-group">
                        <label for="namaSantri">Nama Lengkap Santri</label>
                        <input type="text" id="namaSantri" placeholder="Ketik nama lengkap..." required>
                    </div>
                    <div class="form-group">
                        <label for="kategoriProgram">Program Kluster</label>
                        <select id="kategoriProgram">
                            <option value="BI">BI (Bimbingan Intensif)</option>
                            <option value="BQ">BQ (Bimbingan Quran)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="kelasKamar">Kelas / Kamar Pemetaan</label>
                        <input type="text" id="kelasKamar" placeholder="Contoh: Kelas X - Kamar A" required>
                    </div>
                    <div class="form-group">
                        <label for="statusKehadiran">Status Verifikasi</label>
                        <select id="statusKehadiran">
                            <option value="Hadir">Hadir</option>
                            <option value="Izin">Izin</option>
                            <option value="Sakit">Sakit</option>
                            <option value="Alfa">Alfa</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-submit">Submit ke AI Studio Cloud</button>
                </form>
            </div>
        </div>

        <!-- LOG MONITORING KANAN -->
        <div class="content-area">
            <div class="card-box">
                <div class="table-header-actions">
                    <h2>Log Aktivitas Terintegrasi</h2>
                    <div class="controls">
                        <!-- FITUR FILTER -->
                        <select id="filterProgram" onchange="filterTampilanLocal()">
                            <option value="Semua">Semua Cluster</option>
                            <option value="BI">Kluster BI Only</option>
                            <option value="BQ">Kluster BQ Only</option>
                        </select>
                        <button class="btn-action" onclick="window.print()">Export Log</button>
                    </div>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th>Nama Lengkap</th>
                            <th>Kluster</th>
                            <th>Kamar/Kelas</th>
                            <th>Waktu Sinkron</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tabelBody">
                        <!-- Sinkronisasi Log Awan Firebase Masuk Otomatis -->
